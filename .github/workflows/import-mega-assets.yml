name: Import MEGA assets

on:
  push:
    paths:
      - '.github/workflows/import-mega-assets.yml'
      - 'scripts/import-mega.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-mega:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MEGA downloader
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Download MEGA folder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p '素材/郭文贵/mega'
          megadl 'https://mega.nz/folder/boFk0TiD#iX6HknzaJ_VFFyxK56VCLQ' --path '素材/郭文贵/mega'
          find '素材/郭文贵/mega' -type f -print | sort
          du -sh '素材/郭文贵/mega'

      - name: Upload MEGA assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: guo-mega-assets
          path: '素材/郭文贵/mega'
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
