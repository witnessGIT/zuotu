name: Import MEGA assets

on:
  push:
    paths:
      - '.github/workflows/import-mega-assets.yml'
      - 'scripts/import-mega.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-mega:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MEGA downloader and render tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools fonts-noto-cjk
          python -m pip install pillow

      - name: Download MEGA folder
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p '素材/郭文贵/mega'
          megadl 'https://mega.nz/folder/boFk0TiD#iX6HknzaJ_VFFyxK56VCLQ' --path '素材/郭文贵/mega'
          find '素材/郭文贵/mega' -type f -print | sort
          du -sh '素材/郭文贵/mega'

      - name: Build lightweight image index and contact sheets
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import json, math

          root = Path('素材/郭文贵/mega')
          out = Path('mega-preview')
          sheets = out / 'sheets'
          sheets.mkdir(parents=True, exist_ok=True)
          exts = {'.jpg', '.jpeg', '.png', '.webp', '.bmp', '.gif', '.tif', '.tiff'}
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in exts)

          items = []
          for i, p in enumerate(files):
              rec = {'index': i, 'path': p.as_posix(), 'name': p.name}
              try:
                  with Image.open(p) as im:
                      rec.update({'width': im.width, 'height': im.height, 'format': im.format})
              except Exception as e:
                  rec['error'] = str(e)
              items.append(rec)

          cell_w, cell_h = 280, 220
          img_w, img_h = 260, 165
          cols, rows = 4, 4
          per_sheet = cols * rows
          font = ImageFont.load_default()

          for s in range(math.ceil(len(files) / per_sheet)):
              page = Image.new('RGB', (cols * cell_w, rows * cell_h), 'white')
              draw = ImageDraw.Draw(page)
              for j in range(per_sheet):
                  idx = s * per_sheet + j
                  if idx >= len(files):
                      break
                  p = files[idx]
                  x = (j % cols) * cell_w + 10
                  y = (j // cols) * cell_h + 10
                  try:
                      with Image.open(p) as im:
                          im = ImageOps.exif_transpose(im).convert('RGB')
                          im.thumbnail((img_w, img_h))
                          px = x + (img_w - im.width) // 2
                          py = y + (img_h - im.height) // 2
                          page.paste(im, (px, py))
                  except Exception:
                      pass
                  draw.text((x, y + img_h + 5), f'#{idx} {p.name[:30]}', fill='black', font=font)
              page.save(sheets / f'sheet_{s:04d}.jpg', 'JPEG', quality=68, optimize=True)

          (out / 'manifest.json').write_text(json.dumps({'count': len(items), 'items': items}, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'README.txt').write_text(f'Images: {len(items)}\nContact sheets: {math.ceil(len(items) / per_sheet)}\n', encoding='utf-8')
          print(f'Indexed {len(items)} images')
          PY

      - name: Render GETTR poster test with selected MEGA photo
        shell: bash
        run: |
          set -euxo pipefail
          OUT='posters/001-gettr-feedback'
          ASSET="$OUT/assets"
          mkdir -p "$ASSET"

          # Selected after visual review of contact sheet: formal, smiling, landscape,
          # high resolution and with enough surrounding space for poster cropping.
          SRC='素材/郭文贵/mega/Boss Photo/default_1.286.1.jpg'
          test -f "$SRC"
          cp "$SRC" "$ASSET/guo-selected-default_1.286.1.jpg"

          cat > "$OUT/render_with_photo.py" <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps, ImageFilter
          import textwrap

          W, H = 1080, 1440
          root = Path(__file__).resolve().parent
          src = root / 'assets' / 'guo-selected-default_1.286.1.jpg'
          out = root / 'poster-photo-test.png'

          def font(size, bold=False):
              candidates = [
                  '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc' if bold else '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
                  '/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc' if bold else '/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc',
              ]
              for p in candidates:
                  if Path(p).exists(): return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          def fit_cover(im, box):
              return ImageOps.fit(im, box, method=Image.Resampling.LANCZOS, centering=(0.52, 0.50))

          def rounded_rect(draw, xy, radius, fill, outline=None, width=1):
              draw.rounded_rectangle(xy, radius=radius, fill=fill, outline=outline, width=width)

          bg = Image.new('RGB', (W, H), '#0b0d10')
          photo = ImageOps.exif_transpose(Image.open(src)).convert('RGB')
          # Photo occupies right side and extends behind copy as a real photographic background.
          crop = fit_cover(photo, (760, H))
          bg.paste(crop, (320, 0))

          # Strong editorial overlays keep Chinese text crisp while retaining the subject.
          ov = Image.new('RGBA', (W, H), (0,0,0,0))
          od = ImageDraw.Draw(ov)
          for x in range(W):
              if x < 610:
                  a = int(238 - 40 * (x / 610))
              else:
                  a = int(max(25, 198 - (x-610) * 0.40))
              od.line((x,0,x,H), fill=(7,9,12,max(0,min(245,a))))
          od.rectangle((0, 0, W, 210), fill=(0,0,0,48))
          od.rectangle((0, H-220, W, H), fill=(0,0,0,120))
          bg = Image.alpha_composite(bg.convert('RGBA'), ov)
          d = ImageDraw.Draw(bg)

          RED = '#e33a2e'
          CREAM = '#f4f0e7'
          MUTED = '#c9c7c1'
          WHITE = '#ffffff'

          # top label
          d.rectangle((72, 70, 238, 77), fill=RED)
          d.text((72, 96), 'GETTR · 战友作品反馈', font=font(27, True), fill=CREAM)

          d.text((72, 176), '郭先生来电', font=font(42, True), fill=WHITE)
          d.text((72, 240), '“非常非常', font=font(92, True), fill=WHITE)
          d.text((72, 342), '震撼”', font=font(112, True), fill=RED)

          lead = '郭先生今天打来电话，对昨天的 GETTR 活动节目表示非常非常震撼，并对多档节目与作品给出反馈。'
          # wrap by approximate CJK character count
          lines = textwrap.wrap(lead, width=21)
          y = 500
          for line in lines:
              d.text((76, y), line, font=font(30), fill=CREAM)
              y += 49

          rounded_rect(d, (72, 690, 665, 805), 18, fill=(227,58,46,230))
          d.text((102, 714), '“战友们做得都', font=font(34, True), fill=WHITE)
          d.text((102, 758), '非常非常好”', font=font(42, True), fill=WHITE)

          items = [
              'Hpay《为自由而生》', '盘古先生的节目', '避风港第 639 期节目',
              'Q-May 音乐《女猫王的故事》', '台湾农场 8 月 15 日大街访', 'Rica 8 月 28 日节目',
              '意大利农场 8 月 31 日节目', '上海农场 8 月 29 日「经济孤岛」',
              '纽约磐石农场第 112 期', '华盛顿自由农场第 118 期', '英国伦敦阳光农场第 152 期'
          ]
          y = 855
          for i, item in enumerate(items, 1):
              num = f'{i:02d}'
              d.text((76, y), num, font=font(22, True), fill=RED)
              d.text((124, y-1), item, font=font(24, True if i in (1,4) else False), fill=WHITE)
              d.line((76, y+37, 650, y+37), fill=(255,255,255,42), width=1)
              y += 47

          d.text((72, 1370), 'GETTR · FEEDBACK  /  TEST 001', font=font(18, True), fill=MUTED)
          d.text((740, 1370), 'PHOTO: MEGA LIBRARY', font=font(17, True), fill=MUTED)

          bg.convert('RGB').save(out, 'PNG', optimize=True)
          print(out)
          PY

          python "$OUT/render_with_photo.py"

          cat > "$OUT/PHOTO_TEST.md" <<'EOF'
          # GETTR 活动反馈｜实拍人物版测试

          ## 本轮选图
          - MEGA 原始路径：`素材/郭文贵/mega/Boss Photo/default_1.286.1.jpg`
          - 预览索引编号：`#46`
          - 原图尺寸：8288 × 4656
          - 选择理由：正式西装、自然微笑、横向高分辨率，人物与背景关系清晰，适合右侧人物主视觉 + 左侧信息排版。

          ## 生成文件
          - `poster-photo-test.png`：1080 × 1440 测试海报
          - `render_with_photo.py`：Pillow 可重复渲染源文件
          - `assets/guo-selected-default_1.286.1.jpg`：本轮精选原图

          文案沿用本项目 `index.html` 中用户提供的 GETTR 活动反馈信息，不自行增加事实性内容。
          EOF

      - name: Commit selected source and rendered poster
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'zuotu-bot'
          git config user.email 'zuotu-bot@users.noreply.github.com'
          git add 'posters/001-gettr-feedback/assets/guo-selected-default_1.286.1.jpg' \
                  'posters/001-gettr-feedback/render_with_photo.py' \
                  'posters/001-gettr-feedback/poster-photo-test.png' \
                  'posters/001-gettr-feedback/PHOTO_TEST.md'
          if git diff --cached --quiet; then
            echo 'No poster changes to commit.'
          else
            git commit -m 'Add GETTR poster test using selected MEGA photo [skip ci]'
            git push
          fi

      - name: Upload lightweight preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: guo-mega-preview
          path: mega-preview
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload MEGA assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: guo-mega-assets
          path: '素材/郭文贵/mega'
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
